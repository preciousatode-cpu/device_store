<!DOCTYPE html>
<html lang="en">
<head>

      <div class="detail-media" data-detail-media></div>

        <div class="detail-price" data-detail-price></div>
        <p class="detail-blurb" data-detail-blurb></p>
        <ul class="spec-list" data-detail-specs></ul>
        <div class="detail-actions">
          <a class="btn-whatsapp" data-detail-whatsapp target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.8 14.3c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.2-3.5-.7-3-1.2-4.9-4.2-5-4.4-.1-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.4 0 .6-.1.2-.2.3-.4.5-.2.2-.4.4-.2.8.2.4.9 1.5 1.9 2.4 1.3 1.2 2.4 1.5 2.8 1.7.4.2.6.1.8-.1.2-.3.8-1 1-1.3.2-.3.4-.3.7-.2.3.1 1.7.8 2 1 .3.1.5.2.5.4.1.2.1.7-.1 1.3Z"/></svg>
            Ask about this on WhatsApp
          </a>
          <button class="btn-secondary" onclick="history.back()">Back to shop</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="wrap footer" style="border:none;margin:0;padding:0 0 40px;">
      <span>© 2026 Voltaic. Demo store — no real payments.</span>
      <span><a href="whatsapp.html" style="color:var(--muted);text-decoration:none;">Need help? Chat with us</a></span>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="assets/app.js"></script>
  <script>Voltaic.initProductPage();</script>
</body>
</html>
